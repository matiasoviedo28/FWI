server {
    listen 80;
    server_name _;

    # frontend estático (landing en /, mapa en /map)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # API: índices, GeoJSON del día e historial por punto -> servicio api
    location /indices/ { proxy_pass http://api:9000; }
    location /fwi/     { proxy_pass http://api:9000; }
    location /salud    { proxy_pass http://api:9000; }
}
