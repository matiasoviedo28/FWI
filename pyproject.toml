[project]
name = "fwi-argentina"
version = "3.0.1"
description = "Fire Weather Index (CFFWIS) diario para Argentina a partir del WRF-DET del SMN"
requires-python = ">=3.10"
dependencies = [
    # pipeline de datos
    "xarray>=2024.0",
    "netCDF4>=1.6",
    "s3fs>=2024.0",
    "scipy>=1.11",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
    # índices de fuego validados (CFFWIS)
    "xclim>=0.54",
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    # base de datos (plano de control: cobertura + cola de jobs)
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
